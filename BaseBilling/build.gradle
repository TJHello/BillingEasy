// 基础内购库模块，提供跨平台共用的模型、回调和处理接口。
plugins {
    id 'com.android.library'
    id 'maven-publish'
}

ext.verName = "${BASE_VERSION_NAME}"
ext.verCode = BASE_VERSION_CODE
ext.GROUP_ID = 'com.TJHello.publicLib.billing'
ext.POM_ARTIFACT_ID = 'base'
println("${GROUP_ID}:${POM_ARTIFACT_ID}:${verName}")
afterEvaluate{
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = GROUP_ID
                artifactId = POM_ARTIFACT_ID
                version = verName
                artifact sourcesJar
            }
        }
        repositories {
            maven {
                if (!uploadToOnline) {
                    url = uri(LOCAL_REPO_PATH)
                } else {
                    url = ONLINE_REPO_URL
                    credentials {
                        username ONLINE_REPO_USERNAME
                        password ONLINE_REPO_PASSWORD
                    }
                }
            }
        }
    }
}



tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
task sourcesJar(type: Jar) {
    getArchiveClassifier().set('sources')
    from android.sourceSets.main.java.source
}

android {
    namespace 'com.tjhello.lib.billing.base'
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 30

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    publishing {
        singleVariant("release")
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.0'


}
